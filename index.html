<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS-160 Intake</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Sans+Armenian:wght@400;500;600&display=swap');

:root{
  --bg:#F1EFE6;
  --paper:#FCFBF7;
  --ink:#1B2635;
  --ink-soft:#5C6577;
  --line:#DDD6C6;
  --line-soft:#E9E4D6;
  --stamp:#AE3226;
  --stamp-soft:#F1DFDA;
  --brass:#96772A;
  --brass-soft:#EFE5CB;
  --ok:#2E6B45;
  --ok-soft:#DDEBE0;
  --danger:#AE3226;
  --danger-soft:#F1DFDA;
  --shadow-sm: 0 1px 2px rgba(27,38,53,.06);
  --shadow-md: 0 4px 16px rgba(27,38,53,.08);
  --shadow-lg: 0 16px 48px rgba(27,38,53,.14);
  --radius: 12px;
}
*{box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;}
body{margin:0;background:
  radial-gradient(1100px 520px at 12% -8%, #F7F4EA 0%, transparent 60%),
  radial-gradient(900px 460px at 108% 0%, #EFE9D8 0%, transparent 55%),
  var(--bg);
  color:var(--ink);font-family:'IBM Plex Sans','Noto Sans Georgian','Noto Sans Armenian',sans-serif;min-height:100vh;}
h1,h2,h3{font-family:'Fraunces','Noto Sans Georgian','Noto Sans Armenian',serif;font-weight:600;margin:0;letter-spacing:-0.012em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14.5px;}
::selection{background:var(--stamp-soft);}
a{color:inherit;}

.shell{max-width:1080px;margin:0 auto;padding:0 22px 72px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:26px 0;border-bottom:1px solid var(--line);margin-bottom:34px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:14px;flex-shrink:0;position:relative;}
.brand-mark::after{content:'';position:absolute;inset:4px;border:1px dashed var(--line);border-radius:50%;}
.brand-text h1{font-size:20px;}
.brand-text p{margin:2px 0 0;font-size:11px;color:var(--ink-soft);letter-spacing:.07em;text-transform:uppercase;}
.lang-select-wrap{position:relative;display:inline-flex;align-items:center;}
.lang-select-wrap::after{content:'\2304';position:absolute;right:14px;pointer-events:none;color:var(--ink-soft);font-size:13px;top:50%;transform:translateY(-55%);}
.lang-select{appearance:none;-webkit-appearance:none;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:9px 34px 9px 16px;font-size:13.5px;font-weight:500;color:var(--ink);box-shadow:var(--shadow-sm);}
.lang-select:hover{border-color:var(--brass);}
.lang-select:focus{outline:2px solid var(--brass);outline-offset:1px;}

.intro{text-align:center;padding:64px 0 24px;}
.intro-stamp{width:124px;height:124px;margin:0 auto 30px;border:2.5px solid var(--stamp);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--stamp);position:relative;box-shadow:0 0 0 5px var(--stamp-soft);}
.intro-stamp::before{content:'';position:absolute;inset:8px;border:1px solid var(--stamp);border-radius:50%;opacity:.5;}
.intro-stamp span{font-family:'Fraunces',serif;font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;line-height:1.5;}
.intro h2{font-size:34px;max-width:600px;margin:0 auto 16px;line-height:1.18;}
.intro p{color:var(--ink-soft);max-width:480px;margin:0 auto 32px;font-size:15.5px;line-height:1.65;}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:9px;padding:13px 24px;font-size:14.5px;font-weight:500;transition:transform .12s ease, background .12s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--ink);color:#fff;box-shadow:var(--shadow-md);}
.btn-primary:hover{background:#0f1826;}
.btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-stamp{background:var(--stamp);color:#fff;box-shadow:var(--shadow-md);}
.btn-stamp:hover{background:#8e281e;}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;}

.wizard{display:grid;grid-template-columns:250px 1fr;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:540px;box-shadow:var(--shadow-lg);}
.rail{border-right:1px solid var(--line);padding:24px 0;background:linear-gradient(180deg,#F8F6EF,var(--paper) 140px);}
.rail-item{display:flex;align-items:center;gap:12px;padding:11px 22px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;border-left:2px solid transparent;transition:background .12s ease;}
.rail-item:hover{background:var(--line-soft);}
.rail-item.current{color:var(--ink);border-left-color:var(--stamp);background:var(--stamp-soft);font-weight:500;}
.rail-item.done{color:var(--ink);}
.rail-stamp{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;background:#fff;}
.rail-item.done .rail-stamp{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);}
.rail-item.current .rail-stamp{border-color:var(--stamp);color:var(--stamp);}

.panel{padding:36px 40px;}
.panel h2{font-size:22px;margin-bottom:6px;}
.panel .step-count{font-size:12px;color:var(--brass);margin-bottom:24px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;}
.field{margin-bottom:20px;}
.field label{display:block;font-size:13.5px;font-weight:500;margin-bottom:7px;}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=date],.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);transition:border-color .12s ease, box-shadow .12s ease;
}
.field input[type=file]{width:100%;padding:10px 12px;border:1.5px dashed var(--brass);border-radius:9px;background:var(--brass-soft);font-size:13px;}
.field textarea{min-height:76px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft);}
.radio-row{display:flex;gap:10px;}
.radio-pill{flex:1;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:#fff;transition:all .12s ease;}
.radio-pill:hover{border-color:var(--brass);}
.radio-pill.selected{background:var(--ink);color:#fff;border-color:var(--ink);}
.conditional{margin-top:13px;padding:15px 16px;background:var(--bg);border-left:2.5px solid var(--brass);border-radius:0 9px 9px 0;}
.required-mark{color:var(--stamp);margin-left:2px;}

.footer-nav{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-top:1px solid var(--line);background:#F9F7F1;}
.footer-nav .progress-text{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

.review-group{margin-bottom:22px;}
.review-group h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--brass);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;font-weight:600;}
.review-group h3 button{font-size:11px;text-decoration:underline;color:var(--ink-soft);background:none;border:none;text-transform:none;letter-spacing:0;font-weight:400;}
.review-row{display:flex;justify-content:space-between;gap:18px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.review-row .rk{color:var(--ink-soft);flex-shrink:0;}
.review-row .rv{text-align:right;font-weight:500;}

.success{text-align:center;padding:64px 0;}
.success-stamp{width:136px;height:136px;margin:0 auto 26px;border:3px solid var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);color:var(--ok);animation:slam .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 6px var(--ok-soft);}
@keyframes slam{0%{transform:scale(2.4) rotate(-6deg);opacity:0;}100%{transform:scale(1) rotate(-6deg);opacity:1;}}
.success-stamp span{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:.07em;text-transform:uppercase;}
.ref-code{display:inline-block;margin:16px 0 24px;padding:9px 18px;background:var(--paper);border:1px dashed var(--brass);border-radius:9px;font-size:15px;letter-spacing:.04em;box-shadow:var(--shadow-sm);}

.error-box{background:var(--danger-soft);color:#6f1e15;border-radius:10px;padding:13px 16px;font-size:13px;margin:0 40px 20px;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:760px){
  .wizard{grid-template-columns:1fr;border-radius:14px;}
  .rail{display:flex;overflow-x:auto;padding:14px;border-right:none;border-bottom:1px solid var(--line);gap:4px;background:var(--paper);}
  .rail-item{flex-shrink:0;border-left:none;border-bottom:2px solid transparent;padding:9px 13px;}
  .rail-item.current{border-bottom-color:var(--stamp);background:transparent;}
  .panel{padding:24px 20px;}
  .footer-nav{padding:16px 20px;}
  .intro h2{font-size:26px;}
  .error-box{margin:0 20px 16px;}
}
</style>
</head>
<body>
<div class="shell" id="root"></div>

<script>
const LANG_NAMES = {"en": "English", "ru": "Русский", "ro": "Română", "uk": "Українська", "kk": "Қазақша", "uz": "O'zbekcha", "ka": "ქართული", "hy": "Հայերեն", "az": "Azərbaycanca"};

const UI = {"appTitle": {"en": "DS-160 Intake", "ru": "DS-160 — Анкета", "ro": "DS-160 — Chestionar", "uk": "DS-160 — Анкета", "kk": "DS-160 — Сауалнама", "uz": "DS-160 — Anketa", "ka": "DS-160 — კითხვარი", "hy": "DS-160 — Հարցաթերթիկ", "az": "DS-160 — Anket"}, "appSub": {"en": "Visa Application Questionnaire", "ru": "Опросник для визовой заявки", "ro": "Formular pentru cererea de viză", "uk": "Опитувальник для візової заявки", "kk": "Виза өтінімі үшін сауалнама", "uz": "Viza arizasi uchun so'rovnoma", "ka": "ვიზის განაცხადის კითხვარი", "hy": "Վիզայի հայտի հարցաթերթիկ", "az": "Viza müraciəti üçün anket"}, "introTitle": {"en": "Answer a few questions in your own language — we'll turn it into your DS-160.", "ru": "Ответьте на несколько вопросов на своём языке — мы оформим их в DS-160.", "ro": "Răspunde la câteva întrebări în limba ta — le vom transforma în DS-160.", "uk": "Дайте відповіді на кілька запитань своєю мовою — ми оформимо їх у DS-160.", "kk": "Өз тіліңізде бірнеше сұраққа жауап беріңіз — біз оларды DS-160 нысанына рәсімдейміз.", "uz": "O'z tilingizda bir nechta savolga javob bering — biz ularni DS-160 shakliga rasmiylashtiramiz.", "ka": "უპასუხეთ რამდენიმე კითხვას თქვენს ენაზე — ჩვენ მათ DS-160-ად გავაფორმებთ.", "hy": "Պատասխանե՛ք մի քանի հարցի Ձեր լեզվով — մենք դրանք կվերածենք Ձեր DS-160 ձևաթղթի:", "az": "Öz dilinizdə bir neçə suala cavab verin — biz onları sizin DS-160 formanıza çevirəcəyik."}, "introBody": {"en": "This form mirrors the structure of the official U.S. nonimmigrant visa application. Fill it out at your own pace; a consultant will review your answers and prepare the official filing with you.", "ru": "Анкета повторяет структуру официальной формы неиммиграционной визы США. Заполняйте в удобном темпе — консультант проверит ответы и поможет подготовить официальную заявку.", "ro": "Acest formular urmează structura cererii oficiale de viză americană de nonimigrant. Completează în ritmul tău — un consultant îți va verifica răspunsurile și va pregăt "az": "Nəzarət olunan maddələrlə bağlı qanunları heç pozmusunuzmu?"}}, {"id": "prostitution", "type": "radio", "label": {"en": "Have you ever been involved in prostitution or vice within the past 10 years?", "ru": "Были ли вы вовлечены в проституцию за последние 10 лет?", "ro": "Ai fost vreodată implicat în prostituție în ultimii 10 ani?", "uk": "Чи були ви залучені до проституції за останні 10 років?", "kk": "Соңғы 10 жылда жезөкшелікке қатысты болдыңыз ба?", "uz": "So'nggi 10 yil ichida fohishalikka aloqador bo'lganmisiz?", "ka": "ჩართულხართ პროსტიტუციაში ბოლო 10 წლის განმავლობაში?", "hy": "Վերջին 10 տարիներին ներգրավվե՞լ եք մարմնավաճառության մեջ", "az": "Son 10 ildə fahişəliyə cəlb olunmusunuzmu?"}}, {"id": "moneyLaundering", "type": "radio", "label": {"en": "Have you ever been involved in money laundering?", "ru": "Были ли вы вовлечены в отмывание денег?", "ro": "Ai fost vreodată implicat în spălare de bani?", "uk": "Чи були ви залучені до відмивання грошей?", "kk": "Ақша жылыстатуға қатысты болдыңыз ба?", "uz": "Pul yuvishga aloqador bo'lganmisiz?", "ka": "ჩართულხართ ფულის გათეთრებაში?", "hy": "Երբևէ ներգրավվե՞լ եք փողերի լվացման մեջ", "az": "Pul yuma ilə əlaqədar olmusunuzmu?"}}, {"id": "humanTrafficking", "type": "radio", "label": {"en": "Have you committed or conspired to commit human trafficking?", "ru": "Совершали ли вы торговлю людьми или сговор с этой целью?", "ro": "Ai comis sau conspirat pentru trafic de persoane?", "uk": "Чи вчиняли ви торгівлю людьми або змову з цією метою?", "kk": "Адам саудасын жасадыңыз ба немесе оған дайындалдыңыз ба?", "uz": "Odam savdosi qilganmisiz yoki unga fitna uyushtirganmisiz?", "ka": "ჩაუდენიათ ან შეთქმულხართ ადამიანით ვაჭრობის ჩასადენად?", "hy": "Կատարե՞լ կամ դավադրե՞լ եք մարդկանց թրաֆիքինգի համար", "az": "İnsan alverini törətmisiniz və ya buna sui-qəsd etmisinizmi?"}}, {"id": "traffickingBenefit", "type": "radio", "label": {"en": "Have you knowingly benefited from a family member's trafficking activities?", "ru": "Извлекали ли вы выгоду из деятельности родственника, связанной с торговлей людьми?", "ro": "Ai beneficiat cu bună știință de activitățile de trafic ale unui membru al familiei?", "uk": "Чи отримували ви свідомо вигоду від діяльності родича, пов’язаної з торгівлею людьми?", "kk": "Туысыңыздың адам саудасы қызметінен саналы түрде пайда таптыңыз ба?", "uz": "Qarindoshingizning odam savdosi faoliyatidan bilib turib foyda ko'rganmisiz?", "ka": "ისარგებლეთ ოდესმე შეგნებულად ოჯახის წევრის ადამით ვაჭრობის საქმიანობით?", "hy": "Գիտակցաբար օգտվե՞լ եք ընտանիքի անդամի թրաֆիքինգի գործունեությունից", "az": "Ailə üzvünüzün insan alveri fəaliyyətindən bilərəkdən faydalanmısınızmı?"}}, {"id": "h_security", "type": "heading", "label": {"en": "Security and terrorism", "ru": "Безопасность и терроризм", "ro": "Securitate și terorism", "uk": "Безпека та тероризм", "kk": "Қауіпсіздік және терроризм", "uz": "Xavfsizlik va terrorizm", "ka": "უსაფრთხოება და ტერორიზმი", "hy": "Անվտանգություն և ահաբեկչություն", "az": "Təhlükəsizlik və terrorizm"}}, {"id": "espionage", "type": "radio", "label": {"en": "Have you sought to engage in espionage, sabotage, export control violations, or other illegal activity in the U.S.?", "ru": "Пытались ли вы заниматься шпионажем, саботажем или иной незаконной деятельностью в США?", "ro": "Ai încercat să te implici în spionaj, sabotaj sau alte activități ilegale în SUA?", "uk": "Чи намагалися ви займатися шпигунством, саботажем чи іншою незаконною діяльністю у США?", "kk": "АҚШ-та тыңшылықпен, диверсиямен немесе басқа заңсыз әрекетпен айналысуға тырыстыңыз ба?", "uz": "AQShda josuslik, diversiya yoki boshqa noqonuniy faoliyat bilan shug'ullanishga urinib ko'rganmisiz?", "ka": "შეგიცდიათ ჩართულიყავით ჯაშუშობაში, დივერსიაში ან სხვა უკანონო საქმიანობაში აშშ-ში?", "hy": "Փորձե՞լ եք զբաղվել լրտեսությամբ, դիվերսիայով կամ այլ անօրինական գործունեությամբ ԱՄՆ-ում", "az": "ABŞ-da casusluq, sabotaj və ya digər qanunsuz fəaliyyətlə məşğul olmağa cəhd etmisinizmi?"}}, {"id": "terroristActivity", "type": "radio", "label": {"en": "Have you sought to engage in terrorist activities?", "ru": "Пытались ли вы заниматься террористической деятельностью?", "ro": "Ai încercat să te implici în activități teroriste?", "uk": "Чи намагалися ви займатися терористичною діяльністю?", "kk": "Террористік әрекетке қатысуға тырыстыңыз ба?", "uz": "Terroristik faoliyat bilan shug'ullanishga urinib ko'rganmisiz?", "ka": "შეგიცდიათ ჩართულიყავით ტერორისტულ საქმიანობაში?", "hy": "Փորձե՞լ եք զբաղվել ահաբեկչական գործունեությամբ", "az": "Terror fəaliyyəti ilə məşğul olmağa cəhd etmisinizmi?"}}, {"id": "terroristSupport", "type": "radio", "label": {"en": "Have you provided financial assistance or other support to terrorist activities or organizations?", "ru": "Оказывали ли вы финансовую или иную поддержку террористической деятельности или организациям?", "ro": "Ai oferit sprijin financiar sau de altă natură unor activități sau organizații teroriste?", "uk": "Чи надавали ви фінансову або іншу підтримку терористичній діяльності чи організаціям?", "kk": "Террористік әрекетке немесе ұйымдарға қаржылай не басқа қолдау көрсеттіңіз бе?", "uz": "Terroristik faoliyat yoki tashkilotlarga moliyaviy yoki boshqa yordam bergan misiz?", "ka": "გაუწევიათ ფინანსური ან სხვა დახმარება ტერორისტულ საქმიანობას ან ორგანიზაციებს?", "hy": "Տրամադրե՞լ եք ֆինանսական կամ այլ աջակցություն ահաբեկչական գործունեությանը կամ կազմակերպություններին", "az": "Terror fəaliyyətinə və ya təşkilatlarına maliyyə və ya digər dəstək göstərmisinizmi?"}}, {"id": "terroristOrgMember", "type": "radio", "label": {"en": "Are you a member or representative of a terrorist organization?", "ru": "Являетесь ли вы членом или представителем террористической организации?", "ro": "Ești membru sau reprezentant al unei organizații teroriste?", "uk": "Чи є ви членом або представником терористичної організації?", "kk": "Террористік ұйымның мүшесісіз бе немесе өкіліcіз бе?", "uz": "Terroristik tashkilotning a'zosi yoki vakilimisiz?", "ka": "ხართ ტერორისტული ორგანიზაციის წევრი ან წარმომადგენელი?", "hy": "Ահաբեկչական կազմակերպության անդա՞մ կամ ներկայացուցի՞չ եք", "az": "Terror təşkilatının üzvü və ya nümayəndəsisinizmi?"}}, {"id": "familyTerroristActivity", "type": "radio", "label": {"en": "Has a family member engaged in terrorist activity in the last five years?", "ru": "Занимался ли член вашей семьи террористической деятельностью за последние пять лет?", "ro": "A fost implicat un membru al familiei tale în activități teroriste în ultimii cinci ani?", "uk": "Чи займався член вашої родини терористичною діяльністю за останні п’ять років?", "kk": "Соңғы бес жылда отбасы мүшеңіз террорлық әрекетке қатысты ма?", "uz": "So'nggi besh yilda oila a'zoingiz terroristik faoliyat bilan shug'ullanganmi?", "ka": "ჩართულა ოჯახის წევრი ტერორისტულ საქმიანობაში ბოლო ხუთი წლის განმავლობაში?", "hy": "Ընտանիքի անդամը վերջին հինգ տարիներին ներգրավվե՞լ է ահաբեկչական գործունեության մեջ", "az": "Son beş ildə ailə üzvünüz terror fəaliyyətində iştirak edibmi?"}}, {"id": "genocide", "type": "radio", "label": {"en": "Have you ever ordered, incited, assisted, or otherwise participated in genocide?", "ru": "Приказывали ли, подстрекали, помогали или иным образом участвовали в геноциде?", "ro": "Ai ordonat, incitat, ajutat sau participat în vreun fel la genocid?", "uk": "Чи наказували, підбурювали, допомагали чи іншим чином брали участь у геноциді?", "kk": "Геноцидке бұйрық бердіңіз бе, азғырдыңыз ба немесе қатыстыңыз ба?", "uz": "Genotsidga buyruq berganmisiz, undaganmisiz yoki boshqa tarzda ishtirok etganmisiz?", "ka": "უბრძანებიათ, წაუქეზებიათ, დახმარებიხართ ან სხვაგვარად მონაწილეობდით გენოციდში?", "hy": "Երբևէ հրամայե՞լ, դրդե՞լ, օգնե՞լ կամ այլ կերպ մասնակցե՞լ եք ցեղասպանության", "az": "Heç soyqırıma əmr vermisiniz, təhrik etmisiniz, kömək etmisiniz və ya digər şəkildə iştirak etmisinizmi?"}}, {"id": "torture", "type": "radio", "label": {"en": "Have you committed, ordered, incited, assisted, or otherwise participated in torture?", "ru": "Совершали, приказывали, подстрекали, помогали или участвовали в пытках?", "ro": "Ai comis, ordonat, incitat sau participat la tortură?", "uk": "Чи вчиняли, наказували, підбурювали чи брали участь у катуваннях?", "kk": "Азаптауға бұйрық бердіңіз бе, қатыстыңыз ба?", "uz": "Qiynoqqa buyruq berganmisiz yoki ishtirok etganmisiz?", "ka": "ჩაუდენიათ, უბრძანებიათ, წაუქეზებიათ ან სხვაგვარად მონაწილეობდით წამებაში?", "hy": "Կատարե՞լ, հրամայե՞լ, դրդե՞լ կամ մասնակցե՞լ եք խոշտանգումների", "az": "İşgəncəni törətmisiniz, əmr vermisiniz, təhrik etmisiniz və ya iştirak etmisinizmi?"}}, {"id": "extrajudicialKillings", "type": "radio", "label": {"en": "Have you committed extrajudicial killings, political killings, or other acts of violence?", "ru": "Совершали ли вы внесудебные казни, политические убийства или иные акты насилия?", "ro": "Ai comis execuții extrajudiciare, asasinate politice sau alte acte de violență?", "uk": "Чи вчиняли ви позасудові страти, політичні вбивства чи інші акти насильства?", "kk": "Соттан тыс жазалау, саяси кісі өлтіру немесе басқа зорлық-зомбылық жасадыңыз ба?", "uz": "Sud jarayonisiz qatllar, siyosiy qotilliklar yoki boshqa zo'ravonlik harakatlarini sodir etganmisiz?", "ka": "ჩაუდენიათ არასასამართლო სიკვდილით დასჯა, პოლიტიკური მკვლელობა ან სხვა ძალადობრივი აქტი?", "hy": "Կատարե՞լ եք արտադատական սպանություններ, քաղաքական սպանություններ կամ բռնության այլ գործողություններ", "az": "Məhkəməsiz edamlar, siyasi qətllər və ya digər zorakılıq aktları törətmisinizmi?"}}, {"id": "childSoldier", "type": "radio", "label": {"en": "Have you recruited or used child soldiers?", "ru": "Вербовали ли вы детей-солдат или использовали их?", "ro": "Ai recrutat sau folosit copii soldați?", "uk": "Чи вербували ви дітей-солдатів або використовували їх?", "kk": "Бала-солдаттарды тарттыңыз ба немесе пайдаландыңыз ба?", "uz": "Bola-askarlarni jalb qilganmisiz yoki ulardan foydalanganmisiz?", "ka": "გაუწვევიათ ან გამოგიყენებიათ ბავშვი ჯარისკაცები?", "hy": "Զինվորագրե՞լ կամ օգտագործե՞լ եք երեխա-զինվորների", "az": "Uşaq əsgərləri cəlb etmisiniz və ya istifadə etmisinizmi?"}}, {"id": "religiousFreedomViolation", "type": "radio", "label": {"en": "Have you engaged in particularly severe violations of religious freedom?", "ru": "Совершали ли вы особо тяжкие нарушения свободы вероисповедания?", "ro": "Ai comis încălcări deosebit de grave ale libertății religioase?", "uk": "Чи вчиняли ви особливо тяжкі порушення свободи віросповідання?", "kk": "Дін бостандығын аса ауыр бұздыңыз ба?", "uz": "Diniy erkinlikni ayniqsa og'ir buzganmisiz?", "ka": "ჩაუდენიათ განსაკუთრებით მძიმე რელიგიური თავისუფლების დარღვევა?", "hy": "Կատարե՞լ եք կրոնական ազատության հատկապես ծանր խախտումներ", "az": "Dini azadlığın xüsusilə ağır pozuntularını törətmisinizmi?"}}, {"id": "forcedPopulationControl", "type": "radio", "label": {"en": "Have you been directly involved in coercive population control (forced abortion or sterilization)?", "ru": "Были ли вы непосредственно вовлечены в принудительный контроль над рождаемостью (аборты, стерилизация)?", "ro": "Ai fost implicat direct în controlul demografic coercitiv (avort sau sterilizare forțată)?", "uk": "Чи були ви безпосередньо залучені до примусового контролю народжуваності (аборти, стерилізація)?", "kk": "Мәжбүрлі туу бақылауына (түсік немесе стерилизация) тікелей қатыстыңыз ба?", "uz": "Majburiy tug'ilishni nazorat qilishda (majburiy abort yoki sterilizatsiya) bevosita ishtirok etganmisiz?", "ka": "ჩართულხართ პირდაპირ იძულებით მოსახლეობის კონტროლში (იძულებითი აბორტი ან სტერილიზაცია)?", "hy": "Ուղղակիորեն ներգրավվա՞ծ եք եղել բռնի բնակչության հսկողության մեջ (հարկադիր աբորտ կամ ստերիլիզացիա)", "az": "Məcburi doğum nəzarətində (məcburi abort və ya sterilizasiya) birbaşa iştirak etmisinizmi?"}}, {"id": "organTransplant", "type": "radio", "label": {"en": "Have you been involved in the coercive transplantation of human organs or bodily tissue?", "ru": "Были ли вы вовлечены в принудительную трансплантацию органов или тканей чело let state = {
  view:'intro',
  lang:'ru',
  stepIndex:0,
  answers:{},
  files:{},
  visitedSections:new Set(),
  refCode:null,
  submitting:false,
  submitError:false,
};

function t(){ return UI[state.lang]; }
function fieldVisible(f){
  if(!f.conditional) return true;
  return state.answers[f.conditional.on] === f.conditional.eq;
}

async function submitApplication(){
  state.submitting = true;
  state.submitError = false;
  render();
  try{
    const fd = new FormData();
    fd.append('lang', state.lang);
    fd.append('answers', JSON.stringify(state.answers));
    Object.keys(state.files).forEach(fieldId=>{
      fd.append(fieldId, state.files[fieldId], state.files[fieldId].name);
    });
    const resp = await fetch('/api/submit', { method:'POST', body: fd });
    const data = await resp.json();
    if(!resp.ok || !data.ok) throw new Error('submit_failed');
    state.refCode = data.ref;
    state.submitting = false;
    state.view = 'success';
    render();
  }catch(e){
    state.submitting = false;
    state.submitError = true;
    render();
  }
}

function fieldRow(f){
  const label = f.label[state.lang] || f.label.en;
  if(f.type === 'heading'){
    return `<h3 style="font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--brass);margin:24px 0 11px;border-top:1px solid var(--line);padding-top:18px;font-weight:600;">${label}</h3>`;
  }
  const val = state.answers[f.id] || '';
  const req = f.required ? '<span class="required-mark">*</span>' : '';
  let inputHtml = '';
  if(f.type === 'radio'){
    const yesSel = val === 'yes' ? 'selected' : '';
    const noSel = val === 'no' ? 'selected' : '';
    inputHtml = `<div class="radio-row">
      <button type="button" class="radio-pill ${yesSel}" data-field="${f.id}" data-val="yes">${t().yes}</button>
      <button type="button" class="radio-pill ${noSel}" data-field="${f.id}" data-val="no">${t().no}</button>
    </div>`;
  } else if(f.type === 'select'){
    const opts = f.options.map(o=>`<option value="${o.v}" ${val===o.v?'selected':''}>${o.l[state.lang] || o.l.en}</option>`).join('');
    inputHtml = `<select data-field="${f.id}"><option value="">\u2014</option>${opts}</select>`;
  } else if(f.type === 'textarea'){
    inputHtml = `<textarea data-field="${f.id}">${val}</textarea>`;
  } else if(f.type === 'file'){
    const fileName = state.files[f.id] ? state.files[f.id].name : '';
    inputHtml = `<input type="file" data-file="${f.id}" accept="image/*,application/pdf">
      <div class="hint" style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">${fileName ? fileName : t().uploadHint}</div>`;
  } else {
    inputHtml = `<input type="${f.type}" data-field="${f.id}" value="${val.replace(/"/g,'&quot;')}">`;
  }
  return `<div class="field">
    <label>${label}${req}</label>
    ${inputHtml}
  </div>`;
}

function renderTopbar(){
  const opts = LANGS.map(code=>`<option value="${code}" ${state.lang===code?'selected':''}>${LANG_NAMES[code]}</option>`).join('');
  return `<div class="topbar">
    <div class="brand">
      <div class="brand-mark">DS</div>
      <div class="brand-text"><h1>${t().appTitle}</h1><p>${t().appSub}</p></div>
    </div>
    <div class="lang-select-wrap">
      <select class="lang-select" id="lang-select" aria-label="${t().langLabel}">${opts}</select>
    </div>
  </div>`;
}

function renderIntro(){
  return `<div class="intro">
    <div class="intro-stamp"><span>Visa<br>intake</span></div>
    <h2>${t().introTitle}</h2>
    <p>${t().introBody}</p>
    <button class="btn btn-primary" id="start-btn">${t().start}</button>
  </div>`;
}

function renderRail(){
  const items = SECTIONS.map((s,i)=>{
    let cls = '';
    if(i === state.stepIndex) cls = 'current';
    else if(state.visitedSections.has(s.id)) cls = 'done';
    return `<div class="rail-item ${cls}" data-step="${i}">
      <span class="rail-stamp">${cls==='done'?'&#10003;':(i+1)}</span>
      <span>${s.title[state.lang] || s.title.en}</span>
    </div>`;
  }).join('');
  return `<div class="rail">${items}
    <div class="rail-item ${state.stepIndex===SECTIONS.length?'current':''}" data-step="${SECTIONS.length}">
      <span class="rail-stamp">${SECTIONS.length+1}</span><span>${t().review}</span>
    </div>
  </div>`;
}

function renderWizardPanel(){
  if(state.stepIndex >= SECTIONS.length) return renderReview();
  const section = SECTIONS[state.stepIndex];
  const fieldsHtml = section.fields.filter(fieldVisible).map(f=>{
    if(f.conditional) return `<div class="conditional">${fieldRow(f)}</div>`;
    return fieldRow(f);
  }).join('');
  return `<div class="panel">
    <div class="step-count">${t().step} ${state.stepIndex+1} ${t().of} ${SECTIONS.length+1}</div>
    <h2>${section.title[state.lang] || section.title.en}</h2>
    <div style="margin-top:20px;">${fieldsHtml}</div>
  </div>`;
}

function renderReview(){
  const groups = SECTIONS.map(section=>{
    const rows = section.fields.filter(fieldVisible).filter(f=> f.type==='file' ? state.files[f.id] : state.answers[f.id]).map(f=>{
      let v;
      if(f.type === 'file') v = state.files[f.id] ? state.files[f.id].name : '';
      else {
        v = state.answers[f.id];
        if(f.type === 'radio') v = v === 'yes' ? t().yes : t().no;
        if(f.type === 'select'){ const opt=f.options.find(o=>o.v===v); v = opt?(opt.l[state.lang]||opt.l.en):v; }
      }
      return `<div class="review-row"><span class="rk">${f.label[state.lang]||f.label.en}</span><span class="rv">${v}</span></div>`;
    }).join('');
    if(!rows) return '';
    return `<div class="review-group">
      <h3>${section.title[state.lang]||section.title.en} <button data-jump="${SECTIONS.indexOf(section)}">${t().edit}</button></h3>
      ${rows}
    </div>`;
  }).join('');
  return `<div class="panel">
    <div class="step-count">${t().step} ${SECTIONS.length+1} ${t().of} ${SECTIONS.length+1}</div>
    <h2>${t().review}</h2>
    <div style="margin-top:20px;">${groups}</div>
  </div>`;
}

function renderFooterNav(){
  const isReview = state.stepIndex >= SECTIONS.length;
  const backDisabled = state.stepIndex === 0 ? 'disabled' : '';
  const nextLabel = isReview ? (state.submitting ? t().submitting : t().submit) : t().next;
  const nextBtnClass = isReview ? 'btn-stamp' : 'btn-primary';
  const nextDisabled = state.submitting ? 'disabled' : '';
  return `<div class="footer-nav">
    <button class="btn btn-ghost" id="back-btn" ${backDisabled}>${t().back}</button>
    <span class="progress-text">${state.stepIndex+1} / ${SECTIONS.length+1}</span>
    <button class="btn ${nextBtnClass}" id="next-btn" ${nextDisabled}>${nextLabel}</button>
  </div>`;
}

function renderWizard(){
  const errorHtml = state.submitError ? `<div class="error-box">${t().errorMsg}</div>` : '';
  return `<div class="wizard">
    ${renderRail()}
    <div>
      ${renderWizardPanel()}
      ${state.stepIndex >= SECTIONS.length ? errorHtml : ''}
      ${renderFooterNav()}
    </div>
  </div>`;
}

function renderSuccess(){
  return `<div class="success">
    <div class="success-stamp"><span>Received</span></div>
    <h2>${t().successTitle}</h2>
    <p style="color:var(--ink-soft);max-width:460px;margin:14px auto 0;font-size:15px;line-height:1.65;">${t().successBody}</p>
    <div class="ref-code mono">${t().refLabel}: ${state.refCode}</div>
    <div><button class="btn btn-ghost" id="restart-btn">${t().newApp}</button></div>
  </div>`;
}

function render(){
  const root = document.getElementById('root');
  let body = '';
  if(state.view === 'intro') body = renderIntro();
  else if(state.view === 'wizard') body = renderWizard();
  else if(state.view === 'success') body = renderSuccess();
  root.innerHTML = renderTopbar() + body;
  attachHandlers();
}

function attachHandlers(){
  const langSelect = document.getElementById('lang-select');
  if(langSelect) langSelect.addEventListener('change', ()=>{ state.lang = langSelect.value; render(); });

  const startBtn = document.getElementById('start-btn');
  if(startBtn) startBtn.addEventListener('click', ()=>{ state.view='wizard'; state.stepIndex=0; render(); });

  document.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.answers[el.getAttribute('data-field')] = el.value; });
    el.addEventListener('change', ()=>{ state.answers[el.getAttribute('data-field')] = el.value; });
  });
  document.querySelectorAll('[data-file]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-file');
      if(el.files && el.files[0]){ state.files[id] = el.files[0]; render(); }
    });
  });
  document.querySelectorAll('.radio-pill').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.answers[el.getAttribute('data-field')] = el.getAttribute('data-val');
      render();
    });
  });
  document.querySelectorAll('[data-step]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.stepIndex = parseInt(el.getAttribute('data-step')); render(); });
  });
  document.querySelectorAll('[data-jump]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.stepIndex = parseInt(el.getAttribute('data-jump')); render(); });
  });
  const backBtn = document.getElementById('back-btn');
  if(backBtn) backBtn.addEventListener('click', ()=>{
    if(state.stepIndex > 0){ state.stepIndex--; render(); }
  });
  const nextBtn = document.getElementById('next-btn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(state.stepIndex < SECTIONS.length){
      const section = SECTIONS[state.stepIndex];
      state.visitedSections.add(section.id);
      state.stepIndex++;
      render();
    } else {
      submitApplication();
    }
  });
  const restartBtn = document.getElementById('restart-btn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{
    state.answers = {}; state.files = {}; state.visitedSections = new Set(); state.stepIndex = 0; state.view = 'intro'; render();
  });
}

render();
</script>
</body>
</html>
