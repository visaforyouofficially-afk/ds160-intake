<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS-160 Intake</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#F2F1EA;
  --paper:#FBFAF6;
  --ink:#1C2B3A;
  --ink-soft:#5B6672;
  --line:#D8D3C4;
  --stamp:#B3241C;
  --stamp-soft:#F2DEDB;
  --brass:#9C7A2E;
  --brass-soft:#EFE6CE;
  --ok:#2E6B3E;
  --ok-soft:#DEEBDF;
  --danger:#B3241C;
  --danger-soft:#F2DEDB;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

.shell{max-width:1040px;margin:0 auto;padding:0 20px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line);margin-bottom:28px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:14px;flex-shrink:0;}
.brand-text h1{font-size:19px;}
.brand-text p{margin:0;font-size:11px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--paper);}
.lang-switch button{border:none;background:transparent;padding:6px 13px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em;}
.lang-switch button.active{background:var(--ink);color:#fff;}

.intro{text-align:center;padding:50px 0 20px;}
.intro-stamp{width:112px;height:112px;margin:0 auto 26px;border:2.5px solid var(--stamp);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--stamp);}
.intro-stamp span{font-family:'Fraunces',serif;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1.5;}
.intro h2{font-size:30px;max-width:520px;margin:0 auto 14px;}
.intro p{color:var(--ink-soft);max-width:460px;margin:0 auto 30px;font-size:15px;line-height:1.6;}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;padding:12px 22px;font-size:14px;font-weight:500;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#0f1c29;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-stamp{background:var(--stamp);color:#fff;}
.btn-stamp:hover{background:#8f1c16;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.wizard{display:grid;grid-template-columns:230px 1fr;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:520px;}
.rail{border-right:1px solid var(--line);padding:22px 0;}
.rail-item{display:flex;align-items:center;gap:11px;padding:10px 20px;font-size:13px;color:var(--ink-soft);cursor:pointer;border-left:2px solid transparent;}
.rail-item.current{color:var(--ink);border-left-color:var(--stamp);background:var(--stamp-soft);font-weight:500;}
.rail-item.done{color:var(--ink);}
.rail-stamp{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.rail-item.done .rail-stamp{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);}
.rail-item.current .rail-stamp{border-color:var(--stamp);color:var(--stamp);}

.panel{padding:32px 34px;}
.panel h2{font-size:21px;margin-bottom:4px;}
.panel .step-count{font-size:12px;color:var(--ink-soft);margin-bottom:22px;letter-spacing:.03em;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=date],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
}
.field input[type=file]{width:100%;padding:9px 11px;border:1px dashed var(--brass);border-radius:7px;background:var(--brass-soft);font-size:13px;}
.field textarea{min-height:70px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass);}
.radio-row{display:flex;gap:10px;}
.radio-pill{flex:1;text-align:center;padding:9px 8px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;}
.radio-pill.selected{background:var(--ink);color:#fff;border-color:var(--ink);}
.conditional{margin-top:12px;padding:14px;background:var(--bg);border-left:2px solid var(--brass);border-radius:0 7px 7px 0;}
.required-mark{color:var(--stamp);margin-left:2px;}

.footer-nav{display:flex;justify-content:space-between;align-items:center;padding:18px 34px;border-top:1px solid var(--line);}
.footer-nav .progress-text{font-size:12px;color:var(--ink-soft);}

.review-group{margin-bottom:20px;}
.review-group h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.review-group h3 button{font-size:11px;text-decoration:underline;color:var(--ink-soft);background:none;border:none;text-transform:none;letter-spacing:0;}
.review-row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.review-row .rk{color:var(--ink-soft);flex-shrink:0;}
.review-row .rv{text-align:right;font-weight:500;}

.success{text-align:center;padding:56px 0;}
.success-stamp{width:130px;height:130px;margin:0 auto 24px;border:3px solid var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);color:var(--ok);animation:slam .45s cubic-bezier(.2,1.4,.4,1);}
@keyframes slam{0%{transform:scale(2.2) rotate(-6deg);opacity:0;}100%{transform:scale(1) rotate(-6deg);opacity:1;}}
.success-stamp span{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;}
.ref-code{display:inline-block;margin:14px 0 22px;padding:8px 16px;background:var(--paper);border:1px dashed var(--brass);border-radius:7px;font-size:15px;letter-spacing:.04em;}

.error-box{background:var(--danger-soft);color:#7a1712;border-radius:8px;padding:12px 14px;font-size:13px;margin:0 34px 18px;}
.note-box{background:var(--brass-soft);border-radius:8px;padding:12px 14px;font-size:12.5px;color:#5c4a1e;margin:16px 0;line-height:1.5;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:760px){
  .wizard{grid-template-columns:1fr;}
  .rail{display:flex;overflow-x:auto;padding:14px;border-right:none;border-bottom:1px solid var(--line);gap:4px;}
  .rail-item{flex-shrink:0;border-left:none;border-bottom:2px solid transparent;padding:8px 12px;}
  .rail-item.current{border-bottom-color:var(--stamp);}
  .panel{padding:22px 18px;}
  .footer-nav{padding:14px 18px;}
}
</style>
</head>

let state = {
  view:'intro',
  lang:'ru',
  stepIndex:0,
  answers:{},
  files:{},
  visitedSections:new Set(),
  refCode:null,
  submitting:false,
  submitError:false,
};

function t(){ return UI[state.lang]; }
function fieldVisible(f){
  if(!f.conditional) return true;
  return state.answers[f.conditional.on] === f.conditional.eq;
}
function sectionValid(section){
  return section.fields.every(f=>{
    if(!fieldVisible(f)) return true;
    if(!f.required) return true;
    const v = state.answers[f.id];
    return v !== undefined && v !== '';
  });
}

async function submitApplication(){
  state.submitting = true;
  state.submitError = false;
  render();
  try{
    const fd = new FormData();
    fd.append('lang', state.lang);
    fd.append('answers', JSON.stringify(state.answers));
    Object.keys(state.files).forEach(fieldId=>{
      fd.append(fieldId, state.files[fieldId], state.files[fieldId].name);
    });
    const resp = await fetch('/api/submit', { method:'POST', body: fd });
    const data = await resp.json();
    if(!resp.ok || !data.ok) throw new Error('submit_failed');
    state.refCode = data.ref;
    state.submitting = false;
    state.view = 'success';
    render();
  }catch(e){
    state.submitting = false;
    state.submitError = true;
    render();
  }
}

function fieldRow(f){
  const label = f.label[state.lang];
  if(f.type === 'heading'){
    return `<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass);margin:22px 0 10px;border-top:1px solid var(--line);padding-top:16px;">${label}</h3>`;
  }
  const val = state.answers[f.id] || '';
  const req = f.required ? '<span class="required-mark">*</span>' : '';
  let inputHtml = '';
  if(f.type === 'radio'){
    const yesSel = val === 'yes' ? 'selected' : '';
    const noSel = val === 'no' ? 'selected' : '';
    inputHtml = `<div class="radio-row">
      <button type="button" class="radio-pill ${yesSel}" data-field="${f.id}" data-val="yes">${t().yes}</button>
      <button type="button" class="radio-pill ${noSel}" data-field="${f.id}" data-val="no">${t().no}</button>
    </div>`;
  } else if(f.type === 'select'){
    const opts = f.options.map(o=>`<option value="${o.v}" ${val===o.v?'selected':''}>${o.l[state.lang]}</option>`).join('');
    inputHtml = `<select data-field="${f.id}"><option value="">—</option>${opts}</select>`;
  } else if(f.type === 'textarea'){
    inputHtml = `<textarea data-field="${f.id}">${val}</textarea>`;
  } else if(f.type === 'file'){
    const fileName = state.files[f.id] ? state.files[f.id].name : '';
    inputHtml = `<input type="file" data-file="${f.id}" accept="image/*,application/pdf">
      <div class="hint" style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">${fileName ? fileName : t().uploadHint}</div>`;
  } else {
    inputHtml = `<input type="${f.type}" data-field="${f.id}" value="${val.replace(/"/g,'&quot;')}">`;
  }
  return `<div class="field">
    <label>${label}${req}</label>
    ${inputHtml}
  </div>`;
}

function renderTopbar(){
  const langBtns = Object.keys(LANGS).map(code=>
    `<button class="${state.lang===code?'active':''}" data-lang="${code}">${LANGS[code]}</button>`
  ).join('');
  return `<div class="topbar">
    <div class="brand">
      <div class="brand-mark">DS</div>
      <div class="brand-text"><h1>${t().appTitle}</h1><p>${t().appSub}</p></div>
    </div>
    <div class="lang-switch">${langBtns}</div>
  </div>`;
}

function renderIntro(){
  return `<div class="intro">
    <div class="intro-stamp"><span>Visa<br>intake</span></div>
    <h2>${t().introTitle}</h2>
    <p>${t().introBody}</p>
    <button class="btn btn-primary" id="start-btn">${t().start}</button>
  </div>`;
}

function renderRail(){
  const items = SECTIONS.map((s,i)=>{
    let cls = '';
    if(i === state.stepIndex) cls = 'current';
    else if(state.visitedSections.has(s.id)) cls = 'done';
    return `<div class="rail-item ${cls}" data-step="${i}">
      <span class="rail-stamp">${cls==='done'?'&#10003;':(i+1)}</span>
      <span>${s.title[state.lang]}</span>
    </div>`;
  }).join('');
  return `<div class="rail">${items}
    <div class="rail-item ${state.stepIndex===SECTIONS.length?'current':''}" data-step="${SECTIONS.length}">
      <span class="rail-stamp">${SECTIONS.length+1}</span><span>${t().review}</span>
    </div>
  </div>`;
}

function renderWizardPanel(){
  if(state.stepIndex >= SECTIONS.length) return renderReview();
  const section = SECTIONS[state.stepIndex];
  const fieldsHtml = section.fields.filter(fieldVisible).map(f=>{
    if(f.conditional) return `<div class="conditional">${fieldRow(f)}</div>`;
    return fieldRow(f);
  }).join('');
  return `<div class="panel">
    <div class="step-count">${t().step} ${state.stepIndex+1} ${t().of} ${SECTIONS.length+1}</div>
    <h2>${section.title[state.lang]}</h2>
    <div style="margin-top:18px;">${fieldsHtml}</div>
  </div>`;
}

function renderReview(){
  const groups = SECTIONS.map(section=>{
    const rows = section.fields.filter(fieldVisible).filter(f=> f.type==='file' ? state.files[f.id] : state.answers[f.id]).map(f=>{
      let v;
      if(f.type === 'file') v = state.files[f.id] ? state.files[f.id].name : '';
      else {
        v = state.answers[f.id];
        if(f.type === 'radio') v = v === 'yes' ? t().yes : t().no;
        if(f.type === 'select'){ const opt=f.options.find(o=>o.v===v); v = opt?opt.l[state.lang]:v; }
      }
      return `<div class="review-row"><span class="rk">${f.label[state.lang]}</span><span class="rv">${v}</span></div>`;
    }).join('');
    if(!rows) return '';
    return `<div class="review-group">
      <h3>${section.title[state.lang]} <button data-jump="${SECTIONS.indexOf(section)}">${t().edit}</button></h3>
      ${rows}
    </div>`;
  }).join('');
  return `<div class="panel">
    <div class="step-count">${t().step} ${SECTIONS.length+1} ${t().of} ${SECTIONS.length+1}</div>
    <h2>${t().review}</h2>
    <div style="margin-top:18px;">${groups}</div>
  </div>`;
}

function renderFooterNav(){
  const isReview = state.stepIndex >= SECTIONS.length;
  const backDisabled = state.stepIndex === 0 ? 'disabled' : '';
  const nextLabel = isReview ? (state.submitting ? t().submitting : t().submit) : t().next;
  const nextBtnClass = isReview ? 'btn-stamp' : 'btn-primary';
  const nextDisabled = state.submitting ? 'disabled' : '';
  return `<div class="footer-nav">
    <button class="btn btn-ghost" id="back-btn" ${backDisabled}>${t().back}</button>
    <span class="progress-text">${state.stepIndex+1} / ${SECTIONS.length+1}</span>
    <button class="btn ${nextBtnClass}" id="next-btn" ${nextDisabled}>${nextLabel}</button>
  </div>`;
}

function renderWizard(){
  const errorHtml = state.submitError ? `<div class="error-box">${t().errorMsg}</div>` : '';
  return `<div class="wizard">
    ${renderRail()}
    <div>
      ${renderWizardPanel()}
      ${state.stepIndex >= SECTIONS.length ? errorHtml : ''}
      ${renderFooterNav()}
    </div>
  </div>`;
}

function renderSuccess(){
  return `<div class="success">
    <div class="success-stamp"><span>Received</span></div>
    <h2>${t().successTitle}</h2>
    <p style="color:var(--ink-soft);max-width:440px;margin:12px auto 0;font-size:14.5px;line-height:1.6;">${t().successBody}</p>
    <div class="ref-code mono">${t().refLabel}: ${state.refCode}</div>
    <div><button class="btn btn-ghost" id="restart-btn">${t().newApp}</button></div>
  </div>`;
}

function render(){
  const root = document.getElementById('root');
  let body = '';
  if(state.view === 'intro') body = renderIntro();
  else if(state.view === 'wizard') body = renderWizard();
  else if(state.view === 'success') body = renderSuccess();
  root.innerHTML = renderTopbar() + body;
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-lang]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.lang = el.getAttribute('data-lang'); render(); });
  });
  const startBtn = document.getElementById('start-btn');
  if(startBtn) startBtn.addEventListener('click', ()=>{ state.view='wizard'; state.stepIndex=0; render(); });

  document.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.answers[el.getAttribute('data-field')] = el.value; });
    el.addEventListener('change', ()=>{ state.answers[el.getAttribute('data-field')] = el.value; });
  });
  document.querySelectorAll('[data-file]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-file');
      if(el.files && el.files[0]){ state.files[id] = el.files[0]; render(); }
    });
  });
  document.querySelectorAll('.radio-pill').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.answers[el.getAttribute('data-field')] = el.getAttribute('data-val');
      render();
    });
  });
  document.querySelectorAll('[data-step]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.stepIndex = parseInt(el.getAttribute('data-step')); render(); });
  });
  document.querySelectorAll('[data-jump]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.stepIndex = parseInt(el.getAttribute('data-jump')); render(); });
  });
  const backBtn = document.getElementById('back-btn');
  if(backBtn) backBtn.addEventListener('click', ()=>{
    if(state.stepIndex > 0){ state.stepIndex--; render(); }
  });
  const nextBtn = document.getElementById('next-btn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(state.stepIndex < SECTIONS.length){
      const section = SECTIONS[state.stepIndex];
      state.visitedSections.add(section.id);
      state.stepIndex++;
      render();
    } else {
      submitApplication();
    }
  });
  const restartBtn = document.getElementById('restart-btn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{
    state.answers = {}; state.files = {}; state.visitedSections = new Set(); state.stepIndex = 0; state.view = 'intro'; render();
  });
}

render();
</script>
</body>
</html>
